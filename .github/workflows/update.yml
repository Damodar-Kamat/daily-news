name: Update news

on:
  schedule:
    # Every hour at :15 (UTC). GitHub's servers are busiest on the hour, so :15 starts more reliably.
    - cron: "15 * * * *"
  workflow_dispatch:   # "Run workflow" button in the Actions tab, and the ⟳ button on the page
  push:
    branches: [main]

# Nothing by default; each job below asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # save the day-by-day archive to the `archive` branch
      issues: write     # open/close "Feed failing" issues
    steps:
      # Actions are pinned to exact commits (not movable tags) so a compromised
      # upstream release can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Load archive
        run: |
          git clone --quiet --depth 1 --branch archive "https://github.com/${GITHUB_REPOSITORY}.git" store \
            || { mkdir -p store && git -C store init --quiet -b archive; }

      - name: Fetch feeds
        run: python fetch_news.py --store store

      - name: Report broken feeds
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python feed_health.py store

      - name: Save archive
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          cd store
          git add -A
          # One parentless commit each time, so the branch never piles up history.
          commit=$(git commit-tree "$(git write-tree)" -m "Archive snapshot $(date -u +%FT%TZ)")
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${commit}:refs/heads/archive"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
